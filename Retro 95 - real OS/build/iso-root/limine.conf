# Retro 95 boot configuration (Limine v12.10.0 compatible)
# Edit this file to adjust the default entry, timeout, or kernel options.
timeout: 8
default_entry: Start Retro 95
remember_last_entry: no
interface_branding: RETRO 95 Personal Computer Operating System
interface_branding_colour: 000080
interface_help_colour: 000000
interface_help_colour_bright: 000080
interface_resolution: 1024x768
backdrop: 808080
term_background: 00c0c0c0
term_foreground: 000000
term_background_bright: 000080
term_foreground_bright: ffffff
term_palette: 000000;800000;008000;808000;000080;800080;008080;c0c0c0
term_palette_bright: 808080;ff0000;00ff00;ffff00;0000ff;ff00ff;00ffff;ffffff

/Start Retro 95
    protocol: limine
    path: boot():/boot/retro95/kernel.elf
    cmdline: mode=normal

/Start Retro 95 (Safe Mode)
    protocol: limine
    path: boot():/boot/retro95/kernel.elf
    cmdline: safe_mode=1

/Retro 95 Recovery
    protocol: limine
    path: boot():/boot/retro95/kernel.elf
    cmdline: mode=recovery

/System Diagnostics
    protocol: limine
    path: boot():/boot/retro95/kernel.elf
    cmdline: mode=diagnostics

/Advanced Boot Options
    comment: Additional kernel startup modes
//Start Retro 95 (verbose log)
    protocol: limine
    path: boot():/boot/retro95/kernel.elf
    cmdline: mode=normal verbose=1
//Restart in Safe Mode
    protocol: limine
    path: boot():/boot/retro95/kernel.elf
    cmdline: safe_mode=1 verbose=1
